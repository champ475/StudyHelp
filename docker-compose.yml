services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studyhelp
      POSTGRES_PASSWORD: studyhelp
      POSTGRES_DB: studyhelp
    ports:
      - "5432:5432"
    volumes:
      - studyhelp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyhelp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://studyhelp:studyhelp@postgres:5432/studyhelp
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

volumes:
  studyhelp_pg_data:
